version: "3.9"
name: hotel_sp1
services:
  database:
    image: mysql:8.3.0
    volumes:
       - "./:/docker-entrypoint-initdb.d"
    container_name: database_ht1
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=hotel
      - MYSQL_ROOT_PASSWORD=test1234
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      timeout: 20s
      retries: 5

  backend:
    image: lenartl/hotel-backend:sprint-1
    container_name: backend_ht1
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/hotel?serverTimezone=UTC&characterEncoding=utf8
      
  frontend:
    image: lenartl/hotel-frontend:sprint-1
    container_name: frontend_ht1
    ports:
      - "4200:4200"
    depends_on:
      - backend